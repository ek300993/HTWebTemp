<!-- Search results.

     Deliberately a stacked list rather than the image grid used on the shop and
     occasion archives. Search spans baskets AND pages, and pages have no
     featured image — in a grid those results collapse to a bare title in an
     empty cell and tear a hole in the row. A list carries mixed content types
     without depending on every result having a photograph. -->
